<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>On the Go</title>
<meta name="description" content="Order ahead from Boca Raton coffee shops and pick it up on your way.">
<meta name="theme-color" content="#F5F5F3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!--OTG-START-->
<div class="stage">
<div class="app" id="app">

  <section class="screen has-tabs is-active" data-screen="map" aria-label="Order">
    <div class="map-area">
      <svg class="map-svg" id="mapSvg" viewBox="0 0 1300 1300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map of coffee shops in Boca Raton"></svg>
      <div class="float-top">
        <span class="logo" id="logo" aria-hidden="true"></span>
        <label class="search"><span id="searchIcon" aria-hidden="true"></span>
          <input id="q" type="search" placeholder="Search shops or drinks" autocomplete="off" enterkeyhint="search" aria-label="Search coffee shops or drinks">
          <button class="clear" id="qClear" type="button" hidden>Clear</button>
        </label>
      </div>
      <div class="map-credit">Imagery © Esri, Maxar, Earthstar Geographics</div>
      <div class="map-btns">
        <button class="round" id="locate" aria-label="Show my location"></button>
        <button class="round" id="zoomIn" aria-label="Zoom in"></button>
        <button class="round" id="zoomOut" aria-label="Zoom out"></button>
      </div>
    </div>
    <div class="sheet" id="sheet"><div class="sheet-body" id="sheetBody"></div></div>
  </section>

  <section class="screen" data-screen="menu" aria-label="Menu">
    <div class="nav"><button class="back" data-back><span class="bk"></span>Back to map</button><h1 id="menuTitle" class="sr-only"></h1></div>
    <div class="scroll" id="menuBody"></div>
    <div class="bottom-bar" id="cartBar" hidden></div>
  </section>

  <section class="screen" data-screen="cart" aria-label="Your order">
    <div class="nav"><button class="back" data-go="menu"><span class="bk"></span>Menu</button><h1>Your order</h1></div>
    <div class="scroll" id="cartBody"></div>
    <div class="bottom-bar" id="placeBar"></div>
  </section>

  <section class="screen has-tabs" data-screen="specials" aria-label="Promotions">
    <div class="scroll" id="specialsBody"></div>
  </section>

  <section class="screen has-tabs" data-screen="orders" aria-label="Orders">
    <div class="scroll" id="ordersBody"></div>
  </section>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button class="tab" data-go="specials" data-icon="tag">Promotions</button>
    <button class="tab is-active" data-go="map" data-icon="cup">Order</button>
    <button class="tab" data-go="orders" data-icon="receipt">Orders</button>
  </nav>

  <div class="modal" id="itemModal" role="dialog" aria-modal="true" aria-labelledby="itemTitle">
    <div class="nav"><button class="back" data-close><span class="bk"></span>Menu</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
</div>
<!--OTG-END-->
<script src="js/photos.js"></script>
<script src="js/mapdata.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
