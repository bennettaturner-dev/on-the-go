<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>On the Go</title>
<meta name="description" content="Order ahead from Boca Raton coffee shops and pick it up on your way.">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!--OTG-START-->
<div class="stage">
<div class="app" id="app">

  <header class="topbar">
    <div class="brand-mark" id="brandMark" aria-hidden="true"></div>
    <div>
      <div class="brand-name">On the Go</div>
      <div class="brand-city">BOCA RATON, FL</div>
    </div>
    <button class="card-count" data-go="orders" aria-label="Punch card">
      <span class="mini-punch" id="miniPunch"></span><span id="punchText">0/10</span>
    </button>
  </header>

  <main class="screens">
    <section class="screen screen--map is-active" data-screen="stores" aria-label="Map">
      <div class="map-wrap">
        <svg class="map-svg" id="mapSvg" viewBox="0 0 1400 1400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map of coffee shops in Boca Raton"></svg>
        <div class="map-top">
          <label class="search"><span id="searchIcon" aria-hidden="true"></span><input id="storeSearch" type="search" placeholder="Search coffee shops" autocomplete="off" enterkeyhint="search" aria-label="Search coffee shops"></label>
        </div>
        <div class="map-filters" role="group" aria-label="Filter shops">
          <button class="opt-btn is-on" data-filter="all">All</button>
          <button class="opt-btn" data-filter="open">Open now</button>
          <button class="opt-btn" data-filter="curbside">Curbside</button>
          <button class="opt-btn" data-filter="quiet">Short wait</button>
          <button class="opt-btn" data-filter="fav">Saved</button>
        </div>
        <div class="map-ctrls">
          <button data-zoom="in" aria-label="Zoom in"></button>
          <button data-zoom="out" aria-label="Zoom out"></button>
          <button data-locate aria-label="Center on me"></button>
        </div>
        <div class="sheet" id="storeSheet">
          <div class="sheet-grip" aria-hidden="true"></div>
          <div class="sheet-head" id="sheetHead"></div>
          <div class="sheet-body" id="sheetBody"></div>
        </div>
      </div>
    </section>
    <section class="screen" data-screen="menu" aria-label="Menu"></section>
    <section class="screen" data-screen="bag" aria-label="Bag"></section>
    <section class="screen" data-screen="orders" aria-label="Orders"></section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <button class="tab is-active" data-go="stores" data-icon="map">Map</button>
    <button class="tab" data-go="menu" data-icon="menu">Menu</button>
    <button class="tab" data-go="bag" data-icon="bag">Bag</button>
    <button class="tab" data-go="orders" data-icon="orders">Orders</button>
  </nav>

  <div class="modal" id="itemModal" role="dialog" aria-modal="true" aria-label="Customize item">
    <div class="modal-scrim"></div>
    <div class="modal-panel">
      <div class="modal-top"><button class="icon-btn" id="modalClose" data-close aria-label="Close"></button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
</div>
<!--OTG-END-->
<script src="js/mapdata.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
