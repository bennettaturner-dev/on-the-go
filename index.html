<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>On the Go</title>
<meta name="description" content="Order ahead from Boca Raton coffee shops and pick it up on your way.">
<meta name="theme-color" content="#FFFFFF">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!--OTG-START-->
<div class="stage">
<div class="app" id="app">

  <section class="screen has-tabs is-active" data-screen="map" aria-label="Stores">
    <div class="map-wrap">
      <svg class="map-svg" id="mapSvg" viewBox="0 0 1400 1400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map of coffee shops in Boca Raton"></svg>
      <label class="search">
        <span class="logo" id="logo" aria-hidden="true"></span>
        <input id="q" type="search" placeholder="Search coffee shops" autocomplete="off" enterkeyhint="search" aria-label="Search coffee shops">
        <button class="clear" id="qClear" type="button" aria-label="Clear search" hidden></button>
      </label>
      <button class="fab" id="locate" style="top:68px" aria-label="Show my location"></button>
      <div class="sheet" id="sheet">
        <div class="grabber" aria-hidden="true"></div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </div>
  </section>

  <section class="screen" data-screen="menu" aria-label="Menu">
    <div class="nav"><button class="back" data-back aria-label="Back to map"></button><h1 id="menuTitle"></h1><span></span></div>
    <div class="scroll" id="menuBody"></div>
    <div class="cart-bar" id="cartBar" hidden></div>
  </section>

  <section class="screen" data-screen="cart" aria-label="Your order">
    <div class="nav"><button class="back" data-go="menu" aria-label="Back to menu"></button><h1>Your Order</h1><span></span></div>
    <div class="scroll" id="cartBody"></div>
    <div class="cart-bar" id="placeBar"></div>
  </section>

  <section class="screen has-tabs" data-screen="orders" aria-label="Orders">
    <div class="scroll" id="ordersBody"></div>
  </section>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button class="tab is-active" data-go="map" data-icon="map">Stores</button>
    <button class="tab" data-go="orders" data-icon="receipt">Orders</button>
  </nav>

  <div class="modal" id="itemModal" role="dialog" aria-modal="true" aria-label="Customize item">
    <div class="modal-scrim"></div>
    <div class="modal-panel">
      <div class="modal-head"><button class="circle" data-close aria-label="Close" id="closeBtn"></button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>
</div>
</div>
<!--OTG-END-->
<script src="js/mapdata.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
